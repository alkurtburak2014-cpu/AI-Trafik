[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-trafik"
version = "0.1.0"
description = "Modernized adaptive traffic light controller core"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "AI Trafik"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
ai-trafik = "ai_trafik.cli:main"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
